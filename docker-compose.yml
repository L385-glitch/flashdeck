services:
  flashdeck:
    build: .
    container_name: flashdeck
    ports:
      # Reach via <truenas-tailscale-ip>:7373 (daydeck uses 3000)
      - "7373:7373"
    environment:
      - TZ=Europe/Vienna            # adjust to your timezone (cosmetic, logs only)
    volumes:
      - ./data:/data
    restart: unless-stopped
